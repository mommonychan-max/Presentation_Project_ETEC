{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-8">
        <div class="card bg-black text-light border-0 shadow-lg rounded-4">
            <div class="card-body p-4">
                <h2 class="text-warning fw-bold mb-4">Add New Movie</h2>

                <form method="POST" enctype="multipart/form-data">
                    <div class="mb-3">
                        <label class="form-label">Movie Title</label>
                        <input type="text" name="title" class="form-control" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Genre</label>
                        <input type="text" name="genre" class="form-control" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Year</label>
                        <input type="number" name="movie_year" class="form-control" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Description</label>
                        <textarea name="description" class="form-control" rows="4"></textarea>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Poster Image</label>
                        <input type="file" name="image" class="form-control" accept="image/*"
                            onchange="previewImage(event)" required>
                    </div>

                    <div class="text-center mb-4">
                        <img id="preview" class="img-fluid rounded shadow" style="display:none; max-height: 350px;">
                    </div>

                    <button type="submit" class="btn btn-warning w-100 fw-bold"
                        onclick="return confirm('Add this movie?')">
                        Save Movie
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>

<script>
    function previewImage(event) {
        const preview = document.getElementById('preview');
        preview.src = URL.createObjectURL(event.target.files[0]);
        preview.style.display = 'block';
    }
</script>
{% endblock %}
