<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Cinema System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-dark text-light">

    
    <nav class="navbar navbar-expand-lg navbar-dark bg-black shadow">
        <div class="container">

            <a class="navbar-brand fw-bold text-warning" href="{{ url_for('index') }}">
                ETEC Movie Theater 
            </a>

            <div class="ms-auto d-flex align-items-center gap-2">

                {% if session.get('user') %}

                <span class="text-light me-2">
                    👤 {{ session['user'] }} ({{ session['role'] }})
                </span>

                {% if session.get('role') == 'admin' %}
                <a href="{{ url_for('add_movie') }}" class="btn btn-warning btn-sm">+ Add Movie</a>
                {% endif %}

                
                {% if session.get('role') != 'admin' %}
                <a href="{{ url_for('cart') }}" class="btn btn-outline-warning btn-sm">🛒 Cart</a>
                {% endif %}

                <a href="{{ url_for('logout') }}" class="btn btn-danger btn-sm">Logout</a>

                {% else %}

                <a href="{{ url_for('login') }}" class="btn btn-outline-light btn-sm">Login</a>
                <a href="{{ url_for('register') }}" class="btn btn-success btn-sm">Register</a>

                {% endif %}

            </div>
        </div>
    </nav>


    <div class="container mt-4">
        {% block content %}{% endblock %}
    </div>

</body>

</html>
